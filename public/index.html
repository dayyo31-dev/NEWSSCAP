<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>코나아이 뉴스 검색</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --primary: #0057b8;
      --primary-dark: #003d82;
      --accent: #00a3e0;
      --bg: #f5f7fa;
      --card-bg: #ffffff;
      --text: #1a1a2e;
      --text-muted: #6b7280;
      --border: #e5e7eb;
      --radius: 12px;
      --shadow: 0 2px 12px rgba(0,0,0,0.08);
    }

    body {
      font-family: 'Noto Sans KR', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
    }

    /* ── Header ── */
    header {
      background: var(--primary);
      padding: 16px 24px;
      display: flex;
      align-items: center;
      gap: 12px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.15);
    }
    .logo-icon {
      width: 36px; height: 36px;
      background: #fff;
      border-radius: 8px;
      display: flex; align-items: center; justify-content: center;
      font-weight: 700; font-size: 14px; color: var(--primary);
      flex-shrink: 0;
    }
    .logo-text { color: #fff; font-size: 18px; font-weight: 700; }
    .logo-sub  { color: rgba(255,255,255,0.75); font-size: 13px; margin-top: 1px; }

    /* ── Hero ── */
    .hero {
      background: linear-gradient(135deg, var(--primary) 0%, var(--accent) 100%);
      padding: 48px 24px 56px;
      text-align: center;
      color: #fff;
    }
    .hero h1 { font-size: 28px; font-weight: 700; margin-bottom: 8px; }
    .hero p  { font-size: 15px; opacity: 0.85; margin-bottom: 32px; }

    /* ── Search Box ── */
    .search-wrap {
      max-width: 640px;
      margin: 0 auto;
      position: relative;
    }
    .search-box {
      display: flex;
      background: #fff;
      border-radius: 50px;
      overflow: hidden;
      box-shadow: 0 4px 20px rgba(0,0,0,0.18);
    }
    .search-box input {
      flex: 1;
      border: none;
      outline: none;
      padding: 16px 24px;
      font-size: 16px;
      font-family: inherit;
      color: var(--text);
    }
    .search-box button {
      background: var(--primary);
      color: #fff;
      border: none;
      padding: 16px 28px;
      font-size: 15px;
      font-weight: 700;
      font-family: inherit;
      cursor: pointer;
      transition: background 0.2s;
      white-space: nowrap;
    }
    .search-box button:hover { background: var(--primary-dark); }

    /* ── Keyword Chips ── */
    .chips {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      justify-content: center;
      margin-top: 20px;
    }
    .chip {
      background: rgba(255,255,255,0.2);
      color: #fff;
      border: 1px solid rgba(255,255,255,0.4);
      border-radius: 20px;
      padding: 6px 16px;
      font-size: 13px;
      font-family: inherit;
      cursor: pointer;
      transition: background 0.2s, border-color 0.2s;
    }
    .chip:hover { background: rgba(255,255,255,0.35); }
    .chip.active { background: #fff; color: var(--primary); font-weight: 700; }

    /* ── Main Content ── */
    main { max-width: 900px; margin: 0 auto; padding: 32px 24px 64px; }

    /* ── Result Info ── */
    .result-info {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 20px;
      flex-wrap: wrap;
      gap: 8px;
    }
    .result-count { font-size: 14px; color: var(--text-muted); }
    .result-count strong { color: var(--primary); font-weight: 700; }
    .crawl-btn {
      background: none;
      border: 1px solid var(--primary);
      color: var(--primary);
      border-radius: 8px;
      padding: 6px 16px;
      font-size: 13px;
      font-family: inherit;
      cursor: pointer;
      transition: all 0.2s;
    }
    .crawl-btn:hover { background: var(--primary); color: #fff; }
    .crawl-btn:disabled { opacity: 0.5; cursor: not-allowed; }

    /* ── Article Cards ── */
    #articles { display: flex; flex-direction: column; gap: 16px; }

    .article-card {
      background: var(--card-bg);
      border-radius: var(--radius);
      padding: 20px 24px;
      box-shadow: var(--shadow);
      border: 1px solid var(--border);
      transition: transform 0.15s, box-shadow 0.15s;
    }
    .article-card:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(0,0,0,0.12);
    }

    .article-meta {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 8px;
      flex-wrap: wrap;
    }
    .article-source {
      font-size: 12px;
      font-weight: 700;
      color: var(--primary);
      background: #eff6ff;
      padding: 2px 10px;
      border-radius: 12px;
    }
    .article-keyword {
      font-size: 11px;
      color: var(--text-muted);
      background: #f3f4f6;
      padding: 2px 8px;
      border-radius: 10px;
    }
    .article-date { font-size: 12px; color: var(--text-muted); margin-left: auto; }

    .article-title {
      font-size: 16px;
      font-weight: 700;
      line-height: 1.5;
      margin-bottom: 8px;
    }
    .article-title a {
      color: var(--text);
      text-decoration: none;
      transition: color 0.15s;
    }
    .article-title a:hover { color: var(--primary); }

    .article-content {
      font-size: 14px;
      color: var(--text-muted);
      line-height: 1.6;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    /* highlight */
    mark {
      background: #fef08a;
      color: inherit;
      border-radius: 2px;
      padding: 0 2px;
    }

    /* ── Empty / Loading ── */
    .state-msg {
      text-align: center;
      padding: 60px 24px;
      color: var(--text-muted);
    }
    .state-msg .icon { font-size: 48px; margin-bottom: 16px; }
    .state-msg p { font-size: 15px; }

    /* ── Pagination ── */
    .pagination {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 6px;
      margin-top: 32px;
      flex-wrap: wrap;
    }
    .page-btn {
      min-width: 36px; height: 36px;
      border: 1px solid var(--border);
      background: #fff;
      border-radius: 8px;
      font-size: 14px;
      font-family: inherit;
      cursor: pointer;
      transition: all 0.15s;
      display: flex; align-items: center; justify-content: center;
    }
    .page-btn:hover:not(:disabled) { border-color: var(--primary); color: var(--primary); }
    .page-btn.active { background: var(--primary); color: #fff; border-color: var(--primary); font-weight: 700; }
    .page-btn:disabled { opacity: 0.4; cursor: not-allowed; }

    /* ── Toast ── */
    .toast {
      position: fixed; bottom: 24px; right: 24px;
      background: #1f2937; color: #fff;
      padding: 12px 20px; border-radius: 10px;
      font-size: 14px; box-shadow: 0 4px 16px rgba(0,0,0,0.2);
      opacity: 0; pointer-events: none;
      transition: opacity 0.3s;
      z-index: 999;
    }
    .toast.show { opacity: 1; }

    @media (max-width: 600px) {
      .hero h1 { font-size: 22px; }
      .search-box input { padding: 14px 16px; font-size: 14px; }
      .search-box button { padding: 14px 18px; font-size: 14px; }
      .article-card { padding: 16px; }
      .article-title { font-size: 15px; }
    }
  </style>
</head>
<body>

<header>
  <div class="logo-icon">KI</div>
  <div>
    <div class="logo-text">코나아이 뉴스</div>
    <div class="logo-sub">KONAI News Search</div>
  </div>
</header>

<div class="hero">
  <h1>코나아이 관련 뉴스 검색</h1>
  <p>키워드를 입력하면 관련 뉴스 기사를 검색합니다</p>
  <div class="search-wrap">
    <div class="search-box">
      <input id="searchInput" type="text" placeholder="검색 키워드를 입력하세요 (예: 코나카드, 지역화폐...)" autocomplete="off" />
      <button id="searchBtn">검색</button>
    </div>
    <div class="chips" id="chips">
      <button class="chip" data-kw="">전체</button>
      <button class="chip" data-kw="코나아이">코나아이</button>
      <button class="chip" data-kw="코나카드">코나카드</button>
      <button class="chip" data-kw="코나페이">코나페이</button>
      <button class="chip" data-kw="지역화폐">지역화폐</button>
      <button class="chip" data-kw="핀테크">핀테크</button>
      <button class="chip" data-kw="금융결제">금융결제</button>
    </div>
  </div>
</div>

<main>
  <div class="result-info" id="resultInfo" style="display:none">
    <span class="result-count" id="resultCount"></span>
    <button class="crawl-btn" id="crawlBtn">최신 뉴스 수집</button>
  </div>
  <div id="articles"></div>
  <div class="pagination" id="pagination"></div>
</main>

<div class="toast" id="toast"></div>

<script src="app.js"></script>
</body>
</html>
